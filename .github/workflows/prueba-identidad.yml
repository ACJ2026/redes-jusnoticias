# TEMPORAL: prueba de identidad por URL e inventario en esta rama. No guarda datos. Se borra antes del merge.
name: Prueba identidad de publicaciones
on:
  push:
    branches:
      - claude/identidad-publicaciones
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relevamiento sin guardar
        run: |
          mkdir -p out
          python3 -u scripts/actualizar.py out data/rep2.json | tee run.log
          grep -q "^OK notas" run.log
          python3 scripts/verificar_historial.py data/rep2.json out/rep2.json out/notas2.json
          python3 - <<'PY'
          import json, collections, sys
          sys.path.insert(0, 'scripts')
          from historial import clave_publicacion
          antes = json.load(open('data/rep2.json')); ahora = json.load(open('out/rep2.json'))
          print('Publicaciones antes', len(antes), 'ahora', len(ahora))
          pares = collections.Counter((r['nota_id'], r['medio']) for r in ahora)
          multi = [(k, v) for k, v in pares.items() if v > 1]
          print('Notas con más de un artículo del mismo medio:', len(multi))
          for (nid, medio), v in multi[:30]:
              print(' ', nid, medio, v, [r['url'][:90] for r in ahora if r['nota_id'] == nid and r['medio'] == medio])
          conf = lambda rs: sum(1 for r in rs if r.get('confianza') != 'Baja')
          print('Confirmadas antes', conf(antes), 'ahora', conf(ahora))
          print('Marcadas por revisar (otro artículo del mismo medio):', sum(1 for r in ahora if 'mismo medio (por revisar)' in (r.get('metodo') or '')))
          antes_conf = {(r['nota_id'], r['medio']) for r in antes if r.get('confianza') != 'Baja'}
          antes_pares = {(r['nota_id'], r['medio']) for r in antes}
          nuevas_conf = [r for r in ahora if r.get('confianza') != 'Baja' and (r['nota_id'], r['medio']) not in antes_conf]
          print('Confirmadas en pares que antes no estaban confirmados:', len(nuevas_conf))
          print('  de pares totalmente nuevos:', sum(1 for r in nuevas_conf if (r['nota_id'], r['medio']) not in antes_pares))
          for r in nuevas_conf[:40]: print('   ', r['nota_id'], r['medio'], r['confianza'], r['metodo'][:60], r['url'][:80])
          print('Filas con URL alternativas:', sum(1 for r in ahora if r.get('url_alternativas')))
          ma = {m['medio']: m['notas'] for m in json.load(open('data/medios.json'))}
          mn = {m['medio']: m['notas'] for m in json.load(open('out/medios.json'))}
          print('Medios con distinto conteo de notas:', [(k, ma.get(k), mn.get(k)) for k in mn if ma.get(k) != mn.get(k)][:20])
          PY
          python3 scripts/armar_inventario.py
