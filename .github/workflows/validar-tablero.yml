name: Validar tablero y fuentes de tráfico

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'templates/tablero.html'
      - 'functions/api/redes.js'
      - 'functions/api/google-metrics.js'
      - 'functions/api/revisiones.js'
      - 'migrations/0002_revisiones_publicaciones.sql'
      - 'docs/CLOUDFLARE_PAGES.md'
      - 'BITACORA.md'
      - 'functions/api/tiktok.js'
      - 'functions/api/tiktok/**'
      - 'migrations/0001_tiktok_auth_security.sql'
      - 'tests/test_tiktok.mjs'
      - 'tests/**'
      - '.github/workflows/validar-tablero.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de la API de revisiones
        run: node --check --input-type=module < functions/api/revisiones.js
      - name: Comprobar sintaxis de la API de Google
        run: node --check --input-type=module < functions/api/google-metrics.js
      - name: Comprobar sintaxis de la API de redes
        run: node --check --input-type=module < functions/api/redes.js
      - name: Comprobar sintaxis de la integración TikTok
        run: |
          node --check --input-type=module < functions/api/tiktok.js
          node --check --input-type=module < functions/api/tiktok/auth.js
          node --check --input-type=module < functions/api/tiktok/callback.js
      - name: Probar la API de redes (X, Meta) y la seguridad de TikTok
        run: node --test tests/test_redes_x.mjs tests/test_redes_meta.mjs tests/test_tiktok.mjs
      - name: Comprobar sintaxis del JavaScript del tablero
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("templates/tablero.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*application/json)[^>]*>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f"Se esperaba un script JavaScript y se encontraron {len(scripts)}")
          Path("/tmp/tablero.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/tablero.js
      - name: Ejecutar pruebas de regresión
        run: python3 -m unittest discover -s tests -v
