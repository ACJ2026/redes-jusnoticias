# TEMPORAL: diagnóstico de la lectura de texto completo. No guarda datos. Se borra antes del merge.
name: Prueba lectura de texto completo
on:
  push:
    branches:
      - claude/lectura-texto-completo
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relevamiento sin guardar
        env:
          DIAG_TEXTO: out/diag_texto.json
        run: |
          mkdir -p out
          python3 -u scripts/actualizar.py out data/rep2.json | tee run.log
          grep -q "^OK notas" run.log
          python3 scripts/verificar_historial.py data/rep2.json out/rep2.json out/notas2.json
          grep -E "^(ADN Sur|EQS Notas) |Textos leídos" run.log || true
          python3 - <<'PY'
          import json
          from collections import Counter
          antes = json.load(open('data/rep2.json')); ahora = json.load(open('out/rep2.json'))
          conf = lambda rs: sum(1 for r in rs if r.get('confianza') != 'Baja')
          print('Publicaciones antes', len(antes), 'ahora', len(ahora), '| confirmadas antes', conf(antes), 'ahora', conf(ahora))
          diag = json.load(open('out/diag_texto.json'))
          print('Textos leídos:', len(diag))
          for u in (0.15, 0.2, 0.25, 0.3, 0.35, 0.4):
              print(f'  puntaje de datos >= {u}: {sum(1 for d in diag if d[0] >= u)}')
          print('  frases >= 20%:', sum(1 for d in diag if d[1] >= 0.2))
          print('MEJORES 70 POR DATOS (puntaje, frases, nota, enlace):')
          for d in diag[:70]: print('  ', d[0], d[1], d[2], d[3][:120])
          print('ZONA 0.15-0.25 (muestra):')
          for d in [d for d in diag if 0.15 <= d[0] < 0.25][:25]: print('  ', d[0], d[1], d[2], d[3][:120])
          print('Homeschooling (14873) entre los leídos:', [d for d in diag if d[2] == 14873])
          print('Enlaces con "educar" leídos:', [d for d in diag if 'educar' in d[3] or 'homeschool' in d[3]])
          nuevos = [r for r in ahora if (r.get('metodo') or '').startswith('Revisión de texto') or 'confirmado por texto' in (r.get('metodo') or '')]
          print('Filas por texto:', len(nuevos), Counter(r['confianza'] for r in nuevos))
          PY
