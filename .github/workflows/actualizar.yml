name: Actualizar tablero

on:
  # Permite lanzar una actualización al modificar el propio proceso o el recolector. Disparo manual forzado: 27/10/2026.
  push:
    # El relevamiento escribe datos y genera el HTML público; solo debe ejecutarse desde main.
    branches:
      - main
    paths:
      # Código del recolector y configuración de fuentes: el relevamiento actualiza
      # los datos y reconstruye el tablero en una sola ejecución.
      - '.github/workflows/actualizar.yml'
      - 'scripts/actualizar.py'
      - 'scripts/verificar_publicaciones.py'
      - 'scripts/armar_inventario.py'
      - 'data/fuentes_descubiertas.json'
  schedule:
    # Cada 4 horas para no pasarse de los minutos gratis de GitHub Actions.
    # Cron UTC minuto 59: en Argentina (UTC-3) corresponde a 21:59, 01:59, 05:59, 09:59, 13:59 y 17:59.
    - cron: "59 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = revisa medios + Google Noticias y arma el público; publico = solo arma la versión pública"
        required: false
        default: completo

permissions:
  contents: write

concurrency:
  group: actualizar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar medios y Google Noticias
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'publico')
        run: |
          mkdir -p out
          python3 -u scripts/actualizar.py out data/rep2.json | tee run.log
          grep -q "^OK notas" run.log
          python3 scripts/verificar_publicaciones.py out/notas2.json out/rep2.json
          filas=$(python3 -c "import json;print(len(json.load(open('out/rep2.json'))))")
          antes=$(python3 -c "import json;print(len(json.load(open('data/rep2.json'))))")
          notas_antes=$(python3 -c "import json;print(len(json.load(open('data/notas2.json'))))")
          notas_ahora=$(python3 -c "import json;print(len(json.load(open('out/notas2.json'))))")
          echo "Publicaciones antes: $antes, ahora: $filas"
          echo "Notas antes: $notas_antes, ahora: $notas_ahora"
          # Protección por identidad; mismo verificador cubierto por pruebas unitarias.
          python3 scripts/verificar_historial.py data/rep2.json out/rep2.json out/notas2.json
          # Si cae bruscamente el volumen de publicaciones o notas, se requiere revisión manual.
          if [ "$filas" -lt $((antes * 8 / 10)) ]; then echo "Muy pocas publicaciones, no se guarda"; exit 1; fi
          if [ "$notas_ahora" -lt $((notas_antes * 95 / 100)) ]; then echo "Desaparecieron más del 5% de las notas; no se guarda sin revisión"; exit 1; fi
          cp out/notas2.json out/rep2.json out/medios.json data/
          # Inventario único de medios (no modifica rep2 ni medios); si falla, no frena el relevamiento.
          python3 scripts/armar_inventario.py || echo "AVISO: no se pudo actualizar data/medios_inventario.json"

      - name: Registrar fecha del relevamiento
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'publico')
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > data/actualizado.txt

      - name: Armar versión pública
        run: |
          python3 scripts/armar_publico.py data/notas2.json data/rep2.json data/redes2.json data/canales.json data/medios.json publico/tablero_publico.html
          # Cloudflare Pages publica la carpeta publico/ y sirve index.html
          cp publico/tablero_publico.html publico/index.html

      - name: Verificar sintaxis y ejecutar regresiones antes de guardar
        run: |
          python3 -m py_compile scripts/actualizar.py scripts/historial.py scripts/verificar_publicaciones.py
          node --check api/redes.js
          node --input-type=module --check < functions/api/google-metrics.js
          node --input-type=module --check < functions/api/redes.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("publico/index.html", "/tmp/tablero-publico.js"),
              ("tablero_interno/index.html", "/tmp/tablero-interno.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r'<script(?![^>]*application/json)[^>]*>([\s\S]*?)</script>', html)
              if len(scripts) != 1:
                  raise SystemExit(f"{source}: se esperaba un script y se encontraron {len(scripts)}")
              Path(target).write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/tablero-publico.js
          node --check /tmp/tablero-interno.js
          python3 -m unittest discover -s tests -v

      - name: Guardar
        run: |
          git config user.name "jusnoticias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            # Modo publico: no hubo cambios en datos, pero puede haber cambiado el HTML generado.
            git add publico
            git diff --cached --quiet && exit 0
            git commit -m "público: regeneración del tablero"
            git pull --rebase
            python3 scripts/armar_publico.py data/notas2.json data/rep2.json data/redes2.json data/canales.json data/medios.json publico/tablero_publico.html
            cp publico/tablero_publico.html publico/index.html
            python3 -m unittest discover -s tests -v
            git add publico
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            git push
            exit 0
          fi
          git commit -m "datos: actualización automática $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          # El commit de datos se rebasa por separado para no resolver conflictos eligiendo HTML viejo.
          git checkout -- publico/tablero_publico.html publico/index.html
          git pull --rebase
          # Reconstruir el HTML después del rebase con la plantilla y los datos vigentes de main.
          python3 scripts/armar_publico.py data/notas2.json data/rep2.json data/redes2.json data/canales.json data/medios.json publico/tablero_publico.html
          cp publico/tablero_publico.html publico/index.html
          node --input-type=module --check < functions/api/redes.js
          python3 -m unittest discover -s tests -v
          git add publico
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push
