name: Diagnóstico del buscador (solo lectura)

# Corre solo en ramas de diagnóstico; no escribe datos ni toca main.
on:
  push:
    branches:
      - 'claude/diagnostico-*'

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Listas de noticias de justicia.ar (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PY' | tee salida/busqueda.txt
          import re, urllib.request
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
          base = "https://www.justicia.ar"
          for r in ["/robots.txt", "/feed", "/rss", "/rss.xml", "/feed.xml", "/news-sitemap.xml", "/sitemap-news.xml", "/sitemap.xml", "/sitemap_index.xml", "/novedades"]:
              try:
                  t = get(base + r)
                  print("OK", r, len(t), "| item:", t.count("<item"), "url:", t.count("<url>"), "sitemap:", t.count("<sitemap>"))
                  if r == "/robots.txt": print(t[:600])
                  for x in sorted(set(re.findall(r'https?://www\.justicia\.ar/[^"<> ]+', t)))[:12]: print("   ", x)
              except Exception as e:
                  print("ERROR", r, e)
          PY
      - name: Guardar salida
        run: |
          git config user.name "jusnoticias-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostico-redes-salida
          git rm -rq --cached . ; git add salida; git commit -qm "Diagnóstico: nota 15005"
          git push -f origin diagnostico-redes-salida
