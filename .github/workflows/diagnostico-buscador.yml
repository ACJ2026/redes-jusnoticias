name: Diagnóstico del buscador (solo lectura)

# Corre solo en ramas de diagnóstico; no escribe datos ni toca main.
on:
  push:
    branches:
      - 'claude/diagnostico-*'

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: justicia.ar por número y por buscadores (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PY' | tee salida/busqueda.txt
          import re, urllib.request, urllib.parse
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
              return r.geturl(), r.read().decode("utf-8", "replace")
          for u in ["https://www.justicia.ar/novedades/6342", "https://www.justicia.ar/novedades/6342/2026/11/x"]:
              try:
                  f, t = get(u); tm = re.search(r"<title[^>]*>(.*?)</title>", t, re.S)
                  print("OK", u, "->", f, "|", tm.group(1).strip()[:90] if tm else "")
              except Exception as e: print("ERROR", u, e)
          for path in ["/api/novedades", "/api/novedades?page=1", "/novedades.json"]:
              try:
                  f, t = get("https://www.justicia.ar" + path); print("OK", path, len(t), t[:200].replace("\n", " "))
              except Exception as e: print("ERROR", path, e)
          t0 = get("https://www.justicia.ar/novedades")[1]
          print("scripts/api en /novedades:", sorted(set(re.findall(r'["\'](/[^"\']*(?:api|json|graphql)[^"\']*)["\']', t0)))[:15])
          q = "Banfi encabezó una capacitación sobre justicia restaurativa y responsabilidad penal juvenil"
          for u in ["https://www.bing.com/news/search?q=" + urllib.parse.quote(q) + "&format=rss&setlang=es&cc=AR",
                    "https://www.bing.com/search?q=" + urllib.parse.quote('"' + q + '"') + "&format=rss&setlang=es&cc=AR",
                    "https://news.google.com/rss/search?q=" + urllib.parse.quote(q) + "&hl=es-419&gl=AR&ceid=AR:es-419"]:
              try:
                  f, t = get(u)
                  links = re.findall(r"<link>(.*?)</link>", t)
                  print("\nBUSCADOR", u[:60], "resultados:", len(links), "| justicia.ar:", sum("justicia.ar" in x for x in links))
                  for x in links[:12]: print("   ", urllib.parse.unquote(x)[:150])
              except Exception as e: print("ERROR", u[:60], e)
          PY
      - name: Guardar salida
        run: |
          git config user.name "jusnoticias-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostico-redes-salida
          git rm -rq --cached . ; git add salida; git commit -qm "Diagnóstico: nota 15005"
          git push -f origin diagnostico-redes-salida
