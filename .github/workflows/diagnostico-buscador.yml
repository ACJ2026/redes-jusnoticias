name: Diagnóstico del buscador (solo lectura)

# Corre solo en ramas de diagnóstico; no escribe datos ni toca main.
on:
  push:
    branches:
      - 'claude/diagnostico-*'

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enlaces de la página de novedades de justicia.ar (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PY' | tee salida/busqueda.txt
          import re, urllib.request
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
          for u in ["https://www.justicia.ar/novedades", "https://www.justicia.ar/novedades?page=2", "https://www.justicia.ar/"]:
              try:
                  t = get(u)
                  hrefs = re.findall(r'href="([^"]*novedades/[^"]+)"', t)
                  print("OK", u, len(t), "enlaces de novedades:", len(hrefs))
                  for h in hrefs[:15]: print("   ", h)
                  print("   fechas en la página:", re.findall(r'\b\d{1,2}/\d{1,2}/\d{4}\b', t)[:8])
              except Exception as e:
                  print("ERROR", u, e)
          PY
      - name: Guardar salida
        run: |
          git config user.name "jusnoticias-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostico-redes-salida
          git rm -rq --cached . ; git add salida; git commit -qm "Diagnóstico: nota 15005"
          git push -f origin diagnostico-redes-salida
