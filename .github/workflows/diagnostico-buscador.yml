name: Diagnóstico del buscador (solo lectura)

# Corre solo en ramas de diagnóstico; no escribe datos ni toca main.
on:
  push:
    branches:
      - 'claude/diagnostico-*'

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fecha en una novedad de justicia.ar (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PY' | tee salida/busqueda.txt
          import re, urllib.request
          h = urllib.request.urlopen(urllib.request.Request("https://www.justicia.ar/novedades/6342/n/n/n", headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
          for m in re.finditer(r"2026|noviembre|Nov|datetime|published|fecha", h):
              print(repr(h[max(0, m.start() - 120): m.end() + 80]))
          print("ENLACES 6342:", sorted(set(re.findall(r'[^"\s]*6342[^"\s]*', h)))[:10])
          PY
      - name: Guardar salida
        run: |
          git config user.name "jusnoticias-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostico-redes-salida
          git rm -rq --cached . ; git add salida; git commit -qm "Diagnóstico: nota 15005"
          git push -f origin diagnostico-redes-salida
