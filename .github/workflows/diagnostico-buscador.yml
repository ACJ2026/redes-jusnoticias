name: Diagnóstico del buscador (solo lectura)

# Corre solo en ramas de diagnóstico; no escribe datos ni toca main.
on:
  push:
    branches:
      - 'claude/diagnostico-*'

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lectura de justicia.ar por número (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PY' | tee salida/busqueda.txt
          import re, html, urllib.request
          UA = {"User-Agent": "Mozilla/5.0"}
          def get(url, timeout=30, tries=2):
              for _ in range(tries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout) as r:
                          return r.read().decode(r.headers.get_content_charset() or "utf-8", "replace")
                  except Exception:
                      pass
              return None
          def strip(h): return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", h or ""))).strip()
          def novedad_justicia_ar(n):
              h = get(f'https://www.justicia.ar/novedades/{n}/n/n/n', timeout=15, tries=1) or ''
              ti = re.search(r'<title[^>]*>(.*?)</title>', h, re.S)
              if not ti: return None
              canon = re.search(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"', h) or re.search(r'<meta[^>]+property="og:url"[^>]+content="([^"]+)"', h)
              fe = re.search(r'\b(\d{1,2})/(\d{1,2})/(\d{4})\b', h)
              u = html.unescape(canon.group(1)).strip() if canon and '/novedades/' in canon.group(1) else f'https://www.justicia.ar/novedades/{n}/n/n/n'
              return {'t': re.sub(r'\s*[-|]\s*Justicia\.ar\s*$', '', strip(ti.group(1))), 'u': u,
                      'd': f'{fe.group(3)}-{int(fe.group(2)):02d}-{int(fe.group(1)):02d}' if fe else ''}
          numeros = [int(x) for x in re.findall(r"/novedades/(\d+)/\d{4}/\d{2}/", get("https://www.justicia.ar/") or "")]
          print("máximo en portada:", max(numeros) if numeros else None)
          for n in list(range(max(numeros), max(numeros) - 25, -1)) + [6342]:
              print(n, novedad_justicia_ar(n))
          PY
      - name: Guardar salida
        run: |
          git config user.name "jusnoticias-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostico-redes-salida
          git rm -rq --cached . ; git add salida; git commit -qm "Diagnóstico: nota 15005"
          git push -f origin diagnostico-redes-salida
