name: Pruebas de regresión del historial

on:
  pull_request:
  push:
    branches:
      - "fix/conservar-historial-publicaciones"
      - "feature/indicadores-faciles-de-entender"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-historial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxis de JavaScript
        run: |
          node --check api/redes.js
          node --input-type=module --check < functions/api/google-metrics.js
          node --input-type=module --check < functions/api/redes.js
      - name: Ejecutar pruebas de regresión
        run: python3 -m unittest discover -s tests -v
