name: Diagnóstico de redes (solo lectura)
on:
  push:
    branches:
      - 'claude/diagnostico-redes'
permissions:
  contents: write
jobs:
  redes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Consultar
        run: |
          mkdir -p salida
          python3 diag_redes.py > salida/redes.txt 2>&1 || true
          tail -3 salida/redes.txt
      - name: Guardar salida
        run: |
          git config user.name "jusnoticias-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostico-redes-auditoria
          git rm -rq --cached . ; git add salida; git commit -qm "Diagnóstico redes auditoría"
          git push -f origin diagnostico-redes-auditoria
